<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>body{font:14px/1.6 -apple-system,BlinkMacSystemFont,sans-serif;padding:18px;color:#242424}h2{font-size:17px}p{color:#555}input{width:100%;margin:10px 0}button{background:#222;color:#fff;border:0;border-radius:7px;padding:10px 15px;cursor:pointer}button:disabled{opacity:.5}#status{white-space:pre-wrap}</style></head><body><h2>스토어메이커 상세페이지</h2><p>스토어메이커에서 내려받은 피그마용 파일을 선택하세요. 현재 페이지에 가로 860px 상세페이지가 만들어집니다.</p><input id="file" type="file" accept=".json,application/json"><button id="create" disabled>상세페이지 만들기</button><p id="status" role="status"></p><script>
const file=document.querySelector('#file'), create=document.querySelector('#create'), status=document.querySelector('#status');
file.onchange=()=>{create.disabled=!file.files.length;status.textContent='';};
create.onclick=async()=>{create.disabled=true;try{const data=JSON.parse(await file.files[0].text());if(data.format!=='store-maker-figma'||data.version!==2||data.width!==860||!Array.isArray(data.sections)||!data.images)throw Error('스토어메이커 파일이 아닙니다.');for(const img of Object.values(data.images)){const m=/^data:image\/(?:png|jpeg);base64,(.+)$/.exec(img.data);if(!m)throw Error('지원하지 않는 이미지입니다.');const raw=atob(m[1]);img.bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));delete img.data;}parent.postMessage({pluginMessage:{type:'create',data}},'*');status.textContent='상세페이지를 만들고 있습니다…';}catch(e){status.textContent=e.message;create.disabled=false;}};
onmessage=event=>{const message=event.data.pluginMessage;if(message?.type==='done'||message?.type==='error'){status.textContent=message.message;create.disabled=false;}};
</script></body></html>
